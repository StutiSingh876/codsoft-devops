server {
    listen 80;
    server_name site1.local;

    root /var/www/site1;
    index index.html;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        root /var/www/errors;
    }

    location = /50x.html {
        root /var/www/errors;
    }
}